<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Nissartango</title>
<meta name="robots" content="noindex, nofollow">
<!--
  no-referrer matters more here than on the landing page. This URL carries an
  access token in its fragment. Fragments are not sent in the Referer header by
  any current browser, but the header is the one place a URL leaks without
  anybody doing anything, so it is switched off rather than reasoned about.
-->
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>Retour de connexion</h1>
  <p class="lede">
    Cette page lit la réponse d'authentification contenue dans l'URL.
  </p>

  <!--
    The explicitly allow-listed callback, and now the one the sign-in form
    actually names:
      https://editor.nissartango.fr/auth/callback

    It is served from auth/callback/index.html, so Cloudflare's asset router
    answers /auth/callback with a 307 to /auth/callback/. Both flows survive
    that hop: a fragment is never sent to the server, and a PKCE ?code= is a
    query parameter, which a redirect preserves.

    PKCE completes HERE, which means this page reads the verifier out of
    localStorage and posts it to Supabase. Same origin as the form that stored
    it -- that is the requirement, and it is why a link opened on another
    device cannot be completed.
  -->
  <div id="out"></div>

  <footer>
    <a href="/">Retour</a>
  </footer>
</main>

<script type="module" src="/session.js"></script>
</body>
</html>
