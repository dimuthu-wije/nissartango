<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nissartango — espace éditeur</title>
<!-- Not a public page. Nothing here should be indexed or previewed. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>Espace éditeur</h1>
  <p class="lede">Nissartango — accès réservé aux organisateurs.</p>

  <!--
    Sign-in form AND magic-link destination, because it has to be both.

    The form requests a PKCE link and names /auth/callback as the
    destination. But Supabase's Site URL is https://editor.nissartango.fr with
    no path, and site_url is the fallback for any redirect_to that is not
    allow-listed -- so a link issued anywhere else still lands HERE, at "/".
    session.js therefore handles ?code=, #access_token= and #error= on both
    pages rather than assuming which one a browser will reach.
  -->
  <div id="out"></div>

  <footer>
    Cette page existe pour recevoir un lien de connexion. L'éditeur lui-même
    n'est pas encore construit.
  </footer>
</main>

<script type="module" src="/session.js"></script>
</body>
</html>
