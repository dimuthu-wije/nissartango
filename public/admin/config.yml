backend:
  name: github
  repo: dimuthu-wije/nissartango
  branch: main

media_folder: "public/uploads/events"
public_folder: "/uploads/events"

collections:
  - name: events
    label: "Événements"
    label_singular: "Événement"
    folder: "src/content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "Titre", widget: string }
      - name: type
        label: "Type"
        widget: select
        options: [cours, practica, milonga, stage, demo, festival]
      - name: date
        label: "Date et heure"
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ss"
        hint: "Les horaires doivent correspondre au début et à la fin de la partie dansante de la milonga et non pas à l'heure d'un éventuel cours ou autres qui seront enregistrés dans la partie informations complémentaires ex: La milonga sera précédée d'un cours..."
      - { name: endDate, label: "Date de fin", widget: datetime, required: false, format: "YYYY-MM-DDTHH:mm:ss" }
      - name: recurrence
        label: "Récurrence"
        widget: select
        default: none
        options:
          - { label: "Aucune", value: none }
          - { label: "Chaque semaine", value: weekly }
          - { label: "Toutes les deux semaines", value: biweekly }
          - { label: "Chaque mois", value: monthly }
      - { name: recurrenceEnd, label: "Fin de la récurrence", widget: datetime, required: false, format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - name: exceptions
        label: "Dates annulées"
        label_singular: "Date"
        widget: list
        required: false
        field: { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - name: location
        label: "Lieu"
        widget: object
        fields:
          - { name: name, label: "Nom du lieu", widget: string, required: false }
          - { name: address, label: "Adresse complète", widget: string, required: false }
          - { name: postalCode, label: "Code postal", widget: string, required: false }
      - name: city
        label: "Ville"
        widget: select
        options: [Nice, Cannes, Antibes, Monaco, Menton, Grasse, Saint-Laurent-du-Var, Cagnes-sur-Mer]
        default: Nice
      - name: organizer
        label: "Organisateur"
        widget: relation
        collection: organizers
        search_fields: [name]
        value_field: "{{slug}}"
        display_fields: [name]
        default: nissartango
      - { name: teachers, label: "Professeurs", widget: list, required: false }
      - name: price
        label: "Prix d'entrée"
        widget: object
        required: false
        fields:
          - { name: full, label: "Plein tarif", widget: string, required: false }
          - { name: member, label: "Tarif adhérent/réduit", widget: string, required: false }
      - { name: signupUrl, label: "Lien d'inscription", widget: string, required: false }
      - { name: body, label: "Description", widget: markdown, required: false }
      - { name: image, label: "Affiche", widget: image, required: false }

  - name: organizers
    label: "Organisateurs"
    label_singular: "Organisateur"
    folder: "src/content/organizers"
    create: true
    identifier_field: name
    fields:
      - name: name
        label: "Nom"
        widget: string
        hint: "Toutes ces informations s'afficheront dans les évènements"
      - { name: website, label: "Site web", widget: string, required: false }
      - { name: instagram, label: "Instagram (pseudo)", widget: string, required: false }
      - { name: facebook, label: "Facebook (page)", widget: string, required: false }
      - { name: tiktok, label: "TikTok (pseudo)", widget: string, required: false }
      - { name: email, label: "Email", widget: string, required: false }
      - { name: phone, label: "Téléphone", widget: string, required: false }
    