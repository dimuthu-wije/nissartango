backend:
  name: github
  repo: dimuthu-wije/nissartango
  branch: main

media_folder: "src/assets/events"
public_folder: "/src/assets/events"

collections:
  - name: events
    label: "Événements"
    label_singular: "Événement"
    folder: "src/content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "Titre", widget: string }
      - name: type
        label: "Type"
        widget: select
        options: [cours, practica, milonga, stage, demo, festival]
      - { name: date, label: "Date et heure", widget: datetime, format: "YYYY-MM-DDTHH:mm:ss" }
      - { name: endDate, label: "Date de fin", widget: datetime, required: false, format: "YYYY-MM-DDTHH:mm:ss" }
      - { name: location, label: "Lieu", widget: string }
      - name: city
        label: "Ville"
        widget: select
        options: [Nice, Cannes, Antibes, Monaco, Menton, Grasse, Saint-Laurent-du-Var, Cagnes-sur-Mer]
        default: Nice
      - { name: organizer, label: "Organisateur", widget: string, default: "Nissartango" }
      - { name: organizerUrl, label: "Site de l'organisateur", widget: string, required: false }
      - { name: teachers, label: "Professeurs", widget: list, required: false }
      - { name: price, label: "Tarif", widget: string, required: false }
      - { name: signupUrl, label: "Lien d'inscription", widget: string, required: false }
      - { name: body, label: "Description", widget: markdown, required: false }
      - { name: title_en, label: "Titre (EN)", widget: string, required: false }
      - { name: description_en, label: "Description (EN)", widget: text, required: false }
    